<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<th:block th:replace="~{fragments/layout :: csrfMeta}"></th:block>
	<th:block th:replace="~{fragments/layout :: sidebarPreload}"></th:block>
	<th:block th:replace="~{fragments/layout :: themePreload}"></th:block>
	<th:block th:replace="~{fragments/layout :: estiloPreload}"></th:block>
	<title>Tarefas · Trabalho · Criati</title>
	<link rel="stylesheet" th:href="@{/css/criati-base.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-app.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-trabalho.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-responsive.css}" />
</head>
<body>
	<div class="criati-app">
		<div th:replace="~{fragments/sidebar :: sidebar('trabalho-tarefas')}"></div>
		<div class="criati-sidebar-overlay"></div>

		<div class="criati-main">
			<div th:replace="~{fragments/topbar :: topbar}"></div>

			<main class="criati-content">
				<input type="hidden" id="trabalho-usuario-empresa-atual-id" th:value="${usuarioEmpresaAtualId}" />

				<div class="criati-page-header">
					<h1>Tarefas</h1>
					<p>Acompanhe o andamento das tarefas atribuídas.</p>
				</div>

				<div class="criati-toolbar">
					<div class="criati-field criati-field-busca">
						<label for="trabalho-tarefas-busca">Buscar</label>
						<input id="trabalho-tarefas-busca" class="criati-input" type="search" placeholder="Título da tarefa" />
					</div>
					<div class="criati-field">
						<label for="trabalho-tarefas-situacao">Situação</label>
						<select id="trabalho-tarefas-situacao" class="criati-select">
							<option value="">Todas</option>
							<option value="PENDENTE">Pendente</option>
							<option value="EM_ANDAMENTO">Em andamento</option>
							<option value="CONCLUIDA">Concluída</option>
							<option value="CANCELADA">Cancelada</option>
						</select>
					</div>
					<div class="criati-field">
						<label for="trabalho-tarefas-prioridade">Prioridade</label>
						<select id="trabalho-tarefas-prioridade" class="criati-select">
							<option value="">Todas</option>
							<option value="BAIXA">Baixa</option>
							<option value="MEDIA">Média</option>
							<option value="ALTA">Alta</option>
							<option value="URGENTE">Urgente</option>
						</select>
					</div>
					<div class="criati-field">
						<label for="trabalho-tarefas-status">Status</label>
						<select id="trabalho-tarefas-status" class="criati-select">
							<option value="ATIVO">Ativas</option>
							<option value="INATIVO">Inativas</option>
						</select>
					</div>
					<div class="criati-field">
						<label for="trabalho-tarefas-minhas">
							<input id="trabalho-tarefas-minhas" type="checkbox" /> Minhas tarefas
						</label>
					</div>
					<div class="criati-field">
						<label for="trabalho-tarefas-atrasada">
							<input id="trabalho-tarefas-atrasada" type="checkbox" /> Somente atrasadas
						</label>
					</div>
					<div style="flex: 1"></div>
					<a th:if="${podeEscreverTrabalho}" th:href="@{/app/trabalho/tarefas/nova}" class="criati-btn criati-btn-primary">
						Nova tarefa
					</a>
				</div>

				<p id="trabalho-tarefas-carregando">Carregando tarefas...</p>
				<div id="trabalho-tarefas-erro" class="criati-error-state" hidden>
					<p>Não foi possível carregar as tarefas agora.</p>
				</div>
				<div id="trabalho-tarefas-vazio" class="criati-empty-state" hidden>
					<p>Nenhuma tarefa encontrada com os filtros atuais.</p>
				</div>

				<div id="trabalho-tarefas-conteudo" hidden>
					<div class="criati-table-wrap">
						<table class="criati-table" aria-label="Tarefas empresariais">
							<thead>
								<tr>
									<th>Título</th><th>Processo</th><th>Responsável</th><th>Situação</th>
									<th>Prioridade</th><th>Prazo</th><th>Ações</th>
								</tr>
							</thead>
							<tbody id="trabalho-tarefas-corpo"></tbody>
						</table>
					</div>
					<nav class="criati-trabalho-paginacao" aria-label="Paginação das tarefas">
						<button type="button" class="criati-btn criati-btn-ghost" id="trabalho-tarefas-anterior">Anterior</button>
						<span id="trabalho-tarefas-pagina-info" aria-live="polite"></span>
						<button type="button" class="criati-btn criati-btn-ghost" id="trabalho-tarefas-proxima">Próxima</button>
					</nav>
				</div>
			</main>
		</div>
	</div>

	<div th:replace="~{fragments/feedback :: toasts}"></div>

	<script th:src="@{/js/criati-api.js}"></script>
	<script th:src="@{/js/criati-tema.js}"></script>
	<script th:src="@{/js/criati-estilo.js}"></script>
	<script th:src="@{/js/criati-ui.js}"></script>
	<script th:src="@{/js/criati-auth.js}"></script>
	<script th:src="@{/js/criati-contexto.js}"></script>
	<script th:src="@{/js/criati-aplicacoes.js}"></script>
	<script th:src="@{/js/trabalho-formatacao.js}"></script>
	<script th:src="@{/js/trabalho-api.js}"></script>
	<script th:src="@{/js/trabalho-tarefas.js}"></script>
	<script th:inline="javascript">
		document.addEventListener("DOMContentLoaded", function () {
			CriatiUI.initSidebarToggle();
			CriatiUI.initUserMenu();
			CriatiAuth.initLogout();
			CriatiContexto.iniciar();
			CriatiAplicacoes.carregarSidebar();
			TrabalhoTarefas.iniciar();
		});
	</script>
</body>
</html>
