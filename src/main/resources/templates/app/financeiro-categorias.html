<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<th:block th:replace="~{fragments/layout :: csrfMeta}"></th:block>
	<th:block th:replace="~{fragments/layout :: sidebarPreload}"></th:block>
	<th:block th:replace="~{fragments/layout :: themePreload}"></th:block>
	<th:block th:replace="~{fragments/layout :: estiloPreload}"></th:block>
	<title>Categorias · Financeiro · Criati</title>
	<link rel="stylesheet" th:href="@{/css/criati-base.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-app.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-financeiro.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-responsive.css}" />
</head>
<body>
	<div class="criati-app">
		<div th:replace="~{fragments/sidebar :: sidebar('financeiro')}"></div>
		<div class="criati-sidebar-overlay"></div>

		<div class="criati-main">
			<div th:replace="~{fragments/topbar :: topbar}"></div>

			<main class="criati-content">
				<div class="criati-page-header">
					<h1>Categorias financeiras</h1>
					<p>Organize receitas e despesas por categoria.</p>
				</div>

				<div class="criati-toolbar">
					<div class="criati-field">
						<label for="financeiro-categorias-filtro-status">Status</label>
						<select id="financeiro-categorias-filtro-status" class="criati-select">
							<option value="">Todas</option>
							<option value="ATIVO">Ativas</option>
							<option value="INATIVO">Inativas</option>
						</select>
					</div>
					<div style="flex: 1"></div>
					<button type="button" id="financeiro-categorias-nova-receita" class="criati-btn criati-btn-ghost">
						Nova categoria de receita
					</button>
					<button type="button" id="financeiro-categorias-nova-despesa" class="criati-btn criati-btn-primary">
						Nova categoria de despesa
					</button>
				</div>

				<p id="financeiro-categorias-carregando">Carregando categorias...</p>
				<div id="financeiro-categorias-erro" class="criati-error-state" hidden>
					<p>Nao foi possivel carregar as categorias agora.</p>
				</div>
				<div id="financeiro-categorias-vazio" class="criati-empty-state" hidden>
					<p>Nenhuma categoria cadastrada ainda.</p>
				</div>

				<div id="financeiro-categorias-conteudo" hidden style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
					<section>
						<h2 style="font-size: 1.05rem; margin-bottom: 12px;">Receitas</h2>
						<div id="financeiro-categorias-receitas" style="display: flex; flex-direction: column; gap: 10px;"></div>
					</section>
					<section>
						<h2 style="font-size: 1.05rem; margin-bottom: 12px;">Despesas</h2>
						<div id="financeiro-categorias-despesas" style="display: flex; flex-direction: column; gap: 10px;"></div>
					</section>
				</div>
			</main>
		</div>
	</div>

	<div class="criati-modal-overlay" id="financeiro-categoria-modal" hidden>
		<div class="criati-modal">
			<h2 id="financeiro-categoria-modal-titulo">Nova categoria</h2>
			<form class="criati-modal-form" id="financeiro-categoria-form">
				<div class="criati-field">
					<label for="financeiro-categoria-nome">Nome</label>
					<input class="criati-input" id="financeiro-categoria-nome" name="nome" required maxlength="150" />
				</div>
				<input type="hidden" id="financeiro-categoria-tipo" name="tipo" />
				<div class="criati-modal-acoes">
					<button type="button" class="criati-btn criati-btn-ghost" id="financeiro-categoria-cancelar">Cancelar</button>
					<button type="submit" class="criati-btn criati-btn-primary" id="financeiro-categoria-salvar">Salvar</button>
				</div>
			</form>
		</div>
	</div>

	<div th:replace="~{fragments/feedback :: toasts}"></div>

	<script th:src="@{/js/criati-api.js}"></script>
	<script th:src="@{/js/criati-tema.js}"></script>
	<script th:src="@{/js/criati-estilo.js}"></script>
	<script th:src="@{/js/criati-ui.js}"></script>
	<script th:src="@{/js/criati-auth.js}"></script>
	<script th:src="@{/js/criati-contexto.js}"></script>
	<script th:src="@{/js/criati-aplicacoes.js}"></script>
	<script th:src="@{/js/financeiro-formatacao.js}"></script>
	<script th:src="@{/js/financeiro-api.js}"></script>
	<script th:src="@{/js/financeiro-categorias.js}"></script>
	<script th:inline="javascript">
		document.addEventListener("DOMContentLoaded", function () {
			CriatiUI.initSidebarToggle();
			CriatiUI.initUserMenu();
			CriatiAuth.initLogout();
			CriatiContexto.iniciar();
			CriatiAplicacoes.carregarSidebar();
			FinanceiroCategorias.iniciar();
		});
	</script>
</body>
</html>
