<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<th:block th:replace="~{fragments/layout :: csrfMeta}"></th:block>
	<th:block th:replace="~{fragments/layout :: sidebarPreload}"></th:block>
	<th:block th:replace="~{fragments/layout :: themePreload}"></th:block>
	<th:block th:replace="~{fragments/layout :: estiloPreload}"></th:block>
	<title>Detalhes do processo · Trabalho · Criati</title>
	<link rel="stylesheet" th:href="@{/css/criati-base.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-app.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-trabalho.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-responsive.css}" />
</head>
<body>
	<div class="criati-app">
		<div th:replace="~{fragments/sidebar :: sidebar('trabalho-processos')}"></div>
		<div class="criati-sidebar-overlay"></div>

		<div class="criati-main">
			<div th:replace="~{fragments/topbar :: topbar}"></div>

			<main class="criati-content">
				<input type="hidden" id="trabalho-processo-id" th:value="${processoId}" />
				<input type="hidden" id="trabalho-pode-escrever" th:value="${podeEscreverTrabalho}" />

				<div class="criati-page-header">
					<h1 id="trabalho-processo-detalhe-titulo">Processo</h1>
					<a th:href="@{/app/trabalho/processos}" class="criati-btn criati-btn-ghost">Voltar aos processos</a>
				</div>

				<p id="trabalho-processo-detalhe-carregando">Carregando processo...</p>
				<div id="trabalho-processo-detalhe-erro" class="criati-error-state" hidden>
					<p>Não foi possível carregar este processo.</p>
				</div>

				<div id="trabalho-processo-detalhe-conteudo" hidden>
					<section id="trabalho-processo-detalhe-dados"></section>

					<div class="criati-trabalho-acoes" id="trabalho-processo-detalhe-acoes"></div>

					<h2>Tarefas vinculadas</h2>
					<div class="criati-table-wrap">
						<table class="criati-table" aria-label="Tarefas do processo">
							<thead><tr><th>Título</th><th>Responsável</th><th>Situação</th><th>Prazo</th><th>Ações</th></tr></thead>
							<tbody id="trabalho-processo-detalhe-tarefas"></tbody>
						</table>
					</div>
					<p id="trabalho-processo-detalhe-tarefas-vazio" class="criati-card-sub" hidden>Nenhuma tarefa vinculada a este processo.</p>

					<h2>Histórico</h2>
					<ul id="trabalho-processo-detalhe-historico" class="criati-trabalho-detalhe-linha" style="list-style: none; padding: 0"></ul>
				</div>
			</main>
		</div>
	</div>

	<div th:replace="~{fragments/feedback :: toasts}"></div>

	<script th:src="@{/js/criati-api.js}"></script>
	<script th:src="@{/js/criati-tema.js}"></script>
	<script th:src="@{/js/criati-estilo.js}"></script>
	<script th:src="@{/js/criati-ui.js}"></script>
	<script th:src="@{/js/criati-auth.js}"></script>
	<script th:src="@{/js/criati-contexto.js}"></script>
	<script th:src="@{/js/criati-aplicacoes.js}"></script>
	<script th:src="@{/js/trabalho-formatacao.js}"></script>
	<script th:src="@{/js/trabalho-api.js}"></script>
	<script th:src="@{/js/trabalho-processo-detalhe.js}"></script>
	<script th:inline="javascript">
		document.addEventListener("DOMContentLoaded", function () {
			CriatiUI.initSidebarToggle();
			CriatiUI.initUserMenu();
			CriatiAuth.initLogout();
			CriatiContexto.iniciar();
			CriatiAplicacoes.carregarSidebar();
			TrabalhoProcessoDetalhe.iniciar();
		});
	</script>
</body>
</html>
