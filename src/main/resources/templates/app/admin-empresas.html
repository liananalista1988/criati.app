<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<th:block th:replace="~{fragments/layout :: csrfMeta}"></th:block>
	<th:block th:replace="~{fragments/layout :: sidebarPreload}"></th:block>
	<meta name="color-scheme" content="dark" />
	<title>Administracao de Empresas · Criati</title>
	<link rel="stylesheet" th:href="@{/css/criati-base.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-app.css}" />
	<link rel="stylesheet" th:href="@{/css/criati-responsive.css}" />
</head>
<body>
	<div class="criati-app">
		<div th:replace="~{fragments/sidebar :: sidebar(null)}"></div>
		<div class="criati-sidebar-overlay"></div>

		<div class="criati-main">
			<div th:replace="~{fragments/topbar :: topbar}"></div>

			<main class="criati-content">
				<div class="criati-page-header">
					<h1>Administracao de Empresas</h1>
					<p>Habilite ou desabilite aplicacoes do catalogo para cada empresa.</p>
				</div>

				<p id="criati-admin-empresas-carregando">Carregando empresas...</p>

				<div id="criati-admin-empresas-erro" class="criati-error-state" hidden>
					<p>Nao foi possivel carregar as empresas agora.</p>
				</div>

				<section aria-label="Empresas" id="criati-admin-empresas-lista"></section>

				<div id="criati-admin-empresa-detalhe" class="criati-next-steps" hidden>
					<h2 id="criati-admin-empresa-detalhe-titulo">Aplicacoes</h2>
					<div id="criati-admin-empresa-detalhe-lista"></div>
				</div>
			</main>
		</div>
	</div>

	<div th:replace="~{fragments/feedback :: toasts}"></div>

	<script th:src="@{/js/criati-api.js}"></script>
	<script th:src="@{/js/criati-ui.js}"></script>
	<script th:src="@{/js/criati-auth.js}"></script>
	<script th:src="@{/js/criati-admin-aplicacoes.js}"></script>
	<script th:inline="javascript">
		document.addEventListener("DOMContentLoaded", function () {
			CriatiUI.initSidebarToggle();
			CriatiUI.initUserMenu();
			CriatiAuth.initLogout();
			CriatiAdminAplicacoes.carregarEmpresas();
		});
	</script>
</body>
</html>
