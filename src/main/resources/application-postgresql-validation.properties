# LES-TECH-001 — perfil isolado para validar as migrations Flyway (V1-V12)
# contra um PostgreSQL real (subido via compose.yaml), fora dos testes
# automatizados (que usam H2 com schema gerado pelo Hibernate, nao Flyway).
#
# Nao usar este perfil em homologacao/producao: aponta para o banco
# descartavel do Docker Compose de desenvolvimento local.
#
# Ativar com: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgresql-validation
# Todas as credenciais abaixo sao valores de desenvolvimento local e podem
# ser sobrescritos por variavel de ambiente.

spring.datasource.url=${POSTGRES_VALIDACAO_URL:jdbc:postgresql://localhost:5433/criati_validacao}
spring.datasource.username=${POSTGRES_VALIDACAO_USER:criati_validacao}
spring.datasource.password=${POSTGRES_VALIDACAO_PASSWORD:senha_apenas_desenvolvimento_local}

# Nunca permitir ddl-auto=create neste perfil: o Hibernate so pode validar
# o schema que o Flyway ja aplicou, nunca gera-lo por conta propria.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
# Protecao extra: garante que "flyway clean" nunca possa ser acionado neste
# perfil, mesmo que algum codigo ou configuracao futura tente chama-lo.
spring.flyway.clean-disabled=true

# Reaproveita o mesmo comportamento ja usado em desenvolvimento local
# (application-local.properties) para o fluxo de convites.
criati.convite.expor-token-bruto=true
