spring.application.name=criati

spring.config.import=optional:file:.env[.properties]
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

criati.bootstrap.nome=${CRIATI_BOOTSTRAP_NOME:}
criati.bootstrap.email=${CRIATI_BOOTSTRAP_EMAIL:}
criati.bootstrap.password=${CRIATI_BOOTSTRAP_PASSWORD:}

criati.convite.expiracao-horas=${CRIATI_CONVITE_EXPIRACAO_HORAS:72}
criati.convite.expor-token-bruto=false
