spring.application.name=criati

# Carrega credenciais locais com o projeto aberto diretamente ou a partir da
# pasta workspace. Variaveis do sistema continuam tendo prioridade.
spring.config.import=optional:file:.env[.properties],optional:file:criati/.env[.properties]
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
