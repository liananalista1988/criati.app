spring.application.name=criati

spring.config.import=optional:file:.env[.properties]
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

criati.bootstrap.nome=${CRIATI_BOOTSTRAP_NOME:}
criati.bootstrap.email=${CRIATI_BOOTSTRAP_EMAIL:}
criati.bootstrap.password=${CRIATI_BOOTSTRAP_PASSWORD:}

criati.convite.expiracao-horas=${CRIATI_CONVITE_EXPIRACAO_HORAS:72}
criati.convite.expor-token-bruto=false

criati.dados-demo.habilitados=${CRIATI_DADOS_DEMO_HABILITADOS:false}

criati.financeiro.importacao-ofx.tamanho-maximo-bytes=${CRIATI_IMPORTACAO_OFX_TAMANHO_MAXIMO_BYTES:1048576}
criati.financeiro.importacao-csv.tamanho-maximo-bytes=${CRIATI_IMPORTACAO_CSV_TAMANHO_MAXIMO_BYTES:1048576}
criati.financeiro.importacao-csv.maximo-linhas=${CRIATI_IMPORTACAO_CSV_MAXIMO_LINHAS:10000}
criati.financeiro.importacao-csv.maximo-colunas=${CRIATI_IMPORTACAO_CSV_MAXIMO_COLUNAS:50}
criati.financeiro.importacao-csv.maximo-caracteres-campo=${CRIATI_IMPORTACAO_CSV_MAXIMO_CARACTERES_CAMPO:500}
criati.financeiro.importacao-xlsx.tamanho-maximo-bytes=${CRIATI_IMPORTACAO_XLSX_TAMANHO_MAXIMO_BYTES:2097152}
criati.financeiro.importacao-xlsx.maximo-planilhas=${CRIATI_IMPORTACAO_XLSX_MAXIMO_PLANILHAS:5}
criati.financeiro.importacao-xlsx.maximo-linhas=${CRIATI_IMPORTACAO_XLSX_MAXIMO_LINHAS:10000}
criati.financeiro.importacao-xlsx.maximo-colunas=${CRIATI_IMPORTACAO_XLSX_MAXIMO_COLUNAS:50}
criati.financeiro.importacao-xlsx.maximo-caracteres-celula=${CRIATI_IMPORTACAO_XLSX_MAXIMO_CARACTERES_CELULA:500}
criati.financeiro.importacao-xlsx.maximo-entradas-zip=${CRIATI_IMPORTACAO_XLSX_MAXIMO_ENTRADAS_ZIP:200}
criati.financeiro.importacao-xlsx.maximo-bytes-descompactados=${CRIATI_IMPORTACAO_XLSX_MAXIMO_BYTES_DESCOMPACTADOS:16777216}
